
plugins {
    // Minecraft 26.x uses the non-remapping Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom configures the required Minecraft repositories.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// Disable the default test task; run our custom game-logic tests instead.
tasks.named('test') {
    enabled = false
}

tasks.register('coreTests', JavaExec) {
    group = 'verification'
    description = 'Runs the game-logic tests.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.output + sourceSets.main.output
    mainClass = 'com.riseofnations.core.AllTests'
}

tasks.named('check') {
    dependsOn 'coreTests'
}
