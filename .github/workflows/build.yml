
name: Build Rise of Nations (Minecraft 26.3)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 25 for Minecraft
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build and test
        run: gradle build --no-daemon --stacktrace

      - name: Check mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json'
          CLASSES=$(unzip -l "$JAR" | grep -c '\.class')
          echo "Compiled classes: $CLASSES"
          test "$CLASSES" -gt 10
          cp "$JAR" RiseOfNationsAI-Minecraft-26.3.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RiseOfNationsAI-Minecraft-26.3
          path: RiseOfNationsAI-Minecraft-26.3.jar
          if-no-files-found: error
